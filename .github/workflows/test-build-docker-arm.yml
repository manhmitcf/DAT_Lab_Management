name: Test Build Docker ARM64 (Emulated via QEMU)

on:
  push:
    branches:
      - aicore/optimize_tracking/deploy_jetson
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Cho phép trigger bằng tay từ giao diện GitHub

jobs:
  build-test:
    # Bạn yêu cầu dùng GitHub thông thường (x86_64) và giả lập kiến trúc ARM, do đó ta dùng ubuntu-latest.
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # (Tùy chọn) Giải phóng bộ nhớ: Image Nvidia Deepstream (~14GB) rất tốn đĩa, cần giải phóng trên runner.
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # BƯỚC QUAN TRỌNG: Cài đặt công cụ QEMU để giả lập và build môi trường ARM64 trên Github (x86).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:master

      - name: Test Build Docker Image for ARM64 (QEMU Emulation)
        uses: docker/build-push-action@v5
        with:
          context: ./ai_core
          file: ./ai_core/Dockerfile
          platforms: linux/arm64
          push: false # Chỉ chạy test build xem có lỗi phát sinh không
          tags: dat_lab_management_aicore:test-arm
          # Bật cache của Github Actions để giúp các lần push sau build nhanh hơn
          cache-from: type=gha
          cache-to: type=gha,mode=max
